<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - Travel Site</title>
    
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="stylesheet" href="css/media.css?v=2">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        /* Additional styles for standalone bookings page */
        body {
            margin: 0;
            padding: 0;
            background: url('assets/img/background1.png') center center/cover no-repeat fixed !important;
            min-height: 100vh;
            position: relative;
        }
        
        /* Bottom decoration image */
        body::after {
            content: '';
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23ffffff" fill-opacity="0.1" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,122.7C672,117,768,139,864,133.3C960,128,1056,96,1152,90.7C1248,85,1344,107,1392,117.3L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') no-repeat bottom;
            background-size: cover;
            pointer-events: none;
            z-index: 1;
        }
        
        /* Force override any conflicting backgrounds */
        body.my-bookings,
        .my-bookings,
        .bookings-container,
        .bookings-bg {
            background: url('assets/img/background1.png') center center/cover no-repeat fixed !important;
            background-image: url('assets/img/background1.png') !important;
        }
        
        .bookings-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }
        
        /* .bookings-header {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        } */
        
        .bookings-header .nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .bookings-header .logo {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }
        
        .bookings-header .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .bookings-header .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .my-bookings {
            flex: 1;
            padding: 0;
            position: relative;
        }
        
        .bookings-bg {
            position: relative;
            width: 100%;
            min-height: 100vh;
            border-radius: 0;
            overflow: hidden;
        }
        
        .bookings-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
        }
        
        .bookings-content {
            position: relative;
            z-index: 2;
            padding: 60px 20px;
            color: #fff;
            text-align: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .no-bookings {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            margin-top: 30px;
        }
        
        .no-bookings i {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 20px;
            display: block;
        }
        
        .no-bookings h3 {
            font-size: 1.5em;
            color: #fff;
            margin-bottom: 10px;
        }
        
        .no-bookings p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }
        
        /* Enhanced Booking Card Styles */
        .booking-item {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            animation: slideInScale 0.6s ease-out both;
        }
        
        .booking-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        /* Booking Date Section */
        .booking-date {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.08);
        }
        
        .booking-date span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            min-width: 50px;
            text-align: center;
        }
        
        .booking-date .day {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 18px;
            padding: 10px 14px;
        }
        
        .booking-date .month {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }
        
        .booking-date .year {
            background: rgba(118, 75, 162, 0.1);
            color: #764ba2;
            border: 1px solid rgba(118, 75, 162, 0.2);
        }
        
        /* Booking Details Grid Layout */
        .booking-details {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        
        .booking-details h4 {
            font-size: 1.4em;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 16px;
            line-height: 1.2;
        }
        
        .booking-details .info-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            padding: 8px 0;
        }
        
        .booking-details .info-row i {
            color: #667eea;
            font-size: 16px;
            width: 20px;
            text-align: center;
        }
        
        .booking-details .info-row span {
            color: #5a6c7d;
            font-size: 14px;
            font-weight: 500;
        }
        
        /* Booking Status and Price */
        .booking-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
        }
        
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .status-badge.confirmed {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: #fff;
            box-shadow: 0 2px 8px rgba(40, 167, 69, 0.3);
        }
        
        .status-badge.completed {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            color: #fff;
            box-shadow: 0 2px 8px rgba(108, 117, 125, 0.3);
        }
        
        .status-badge.cancelled {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: #fff;
            box-shadow: 0 2px 8px rgba(220, 53, 69, 0.3);
        }
        
        .booking-status .price {
            font-size: 1.3em;
            font-weight: 800;
            color: #2c3e50;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .bookings-content {
                padding: 40px 20px;
            }
            
            .booking-filters {
                flex-direction: column;
                gap: 15px;
            }
            
            .filter-group {
                width: 100%;
            }
            
            .booking-item {
                padding: 20px;
                margin-bottom: 16px;
            }
            
            .booking-date {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .booking-date span {
                width: auto;
                min-width: auto;
            }
            
            .booking-details h4 {
                font-size: 1.2em;
            }
            
            .booking-status {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            
            .booking-status .price {
                font-size: 1.1em;
            }
        }
        
        @media (max-width: 480px) {
            .booking-details .info-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            
            .booking-details .info-row i {
                align-self: flex-start;
            }
            
            .booking-status {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            
            .booking-status .price {
                text-align: center;
                padding: 8px;
                background: rgba(102, 126, 234, 0.1);
                border-radius: 8px;
            }
        }
        
        @media (max-width: 768px) {
            .bookings-header .nav {
                flex-direction: column;
                gap: 15px;
            }
            
            .bookings-content {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="bookings-container">
        <!-- Navigation Header -->
        <header class="bookings-header">
            <nav class="nav">
                <a href="index.html" class="logo">Trip.Next</a>
                <a href="index.html" class="back-btn">
                    <i class="bi bi-arrow-left"></i> Back to Home
                </a>
            </nav>
        </header>

        <!-- My Bookings Section -->
        <section class="my-bookings">
            <div class="bookings-bg">
                <div class="bookings-overlay"></div>
                <div class="bookings-content">
                    <h2>My Bookings</h2>
                    <p>View and manage your travel bookings</p>
                    
                    <!-- Filter Controls -->
                    <div class="booking-filters">
                        <div class="filter-group">
                            <label for="monthFilter">Month:</label>
                            <select id="monthFilter">
                                <option value="">All Months</option>
                                <option value="1">January</option>
                                <option value="2">February</option>
                                <option value="3">March</option>
                                <option value="4">April</option>
                                <option value="5">May</option>
                                <option value="6">June</option>
                                <option value="7">July</option>
                                <option value="8">August</option>
                                <option value="9">September</option>
                                <option value="10">October</option>
                                <option value="11">November</option>
                                <option value="12">December</option>
                            </select>
                        </div>
                        
                        <div class="filter-group">
                            <label for="yearFilter">Year:</label>
                            <select id="yearFilter">
                                <option value="">All Years</option>
                                <option value="2024">2024</option>
                                <option value="2025">2025</option>
                                <option value="2026" selected>2026</option>
                                <option value="2027">2027</option>
                            </select>
                        </div>
                        
                        <div class="filter-group">
                            <label for="statusFilter">Status:</label>
                            <select id="statusFilter">
                                <option value="">All Bookings</option>
                                <option value="upcoming">Upcoming</option>
                                <option value="past">Past</option>
                                <option value="cancelled">Cancelled</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- Bookings List -->
                    <div class="bookings-list" id="bookingsList">
                        <!-- Bookings will be dynamically loaded here -->
                    </div>
                    
                    <!-- View More Button -->
                    <div class="view-more-container">
                        <button class="view-more-btn" onclick="loadMoreBookings()">View More Bookings</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Interactive Animations Script -->
    <script>
        let allBookings = [];
        let filterBookings = function () {};
        let monthFilter;
        let yearFilter;
        let statusFilter;
        let bookingsList;

        // My Bookings Filter Functionality
        document.addEventListener('DOMContentLoaded', () => {
            monthFilter = document.getElementById('monthFilter');
            yearFilter = document.getElementById('yearFilter');
            statusFilter = document.getElementById('statusFilter');
            bookingsList = document.getElementById('bookingsList');
            
            // Defensive checks for DOM elements
            if (!monthFilter || !yearFilter || !statusFilter || !bookingsList) {
                console.error('Required DOM elements not found');
                return;
            }
            
            // Sample booking data (in real app, this would come from backend)
            allBookings = [
                {
                    id: 1,
                    destination: 'Bali, Indonesia',
                    airport: 'Denpasar Airport',
                    guests: 4,
                    days: 7,
                    nights: 6,
                    date: { day: 15, month: 3, year: 2026 },
                    status: 'confirmed',
                    price: 2450
                },
                {
                    id: 2,
                    destination: 'Dubai',
                    airport: 'Dubai International',
                    guests: 2,
                    days: 3,
                    nights: 2,
                    date: { day: 28, month: 1, year: 2026 },
                    status: 'completed',
                    price: 1850
                },
                {
                    id: 3,
                    destination: 'Paris, France',
                    airport: 'Charles de Gaulle',
                    guests: 6,
                    days: 10,
                    nights: 9,
                    date: { day: 22, month: 4, year: 2026 },
                    status: 'confirmed',
                    price: 4200
                },
                {
                    id: 4,
                    destination: 'Tokyo, Japan',
                    airport: 'Narita International',
                    guests: 3,
                    days: 5,
                    nights: 4,
                    date: { day: 10, month: 5, year: 2026 },
                    status: 'confirmed',
                    price: 3200
                },
                {
                    id: 5,
                    destination: 'London, UK',
                    airport: 'Heathrow',
                    guests: 2,
                    days: 4,
                    nights: 3,
                    date: { day: 5, month: 2, year: 2026 },
                    status: 'cancelled',
                    price: 1800
                }
            ];
            
            filterBookings = function filterBookings() {
                const selectedMonth = parseInt(monthFilter.value) || null;
                const selectedYear = parseInt(yearFilter.value) || null;
                const selectedStatus = statusFilter.value || null;
                
                let filteredBookings = [...allBookings];
                
                // Filter by month
                if (selectedMonth) {
                    filteredBookings = filteredBookings.filter(booking => 
                        booking.date.month === selectedMonth);
                }
                
                // Filter by year
                if (selectedYear) {
                    filteredBookings = filteredBookings.filter(booking => 
                        booking.date.year === selectedYear);
                }
                
                // Filter by status
                if (selectedStatus) {
                    const today = new Date();
                    filteredBookings = filteredBookings.filter(booking => {
                        if (selectedStatus === 'upcoming') {
                            return new Date(booking.date.year, booking.date.month - 1, booking.date.day) > today;
                        } else if (selectedStatus === 'past') {
                            return new Date(booking.date.year, booking.date.month - 1, booking.date.day) <= today;
                        } else {
                            return booking.status === selectedStatus;
                        }
                    });
                }
                
                displayBookings(filteredBookings);
            };
            
            function displayBookings(bookings) {
                bookingsList.innerHTML = '';
                
                if (bookings.length === 0) {
                    bookingsList.innerHTML = `
                        <div class="no-bookings">
                            <i class="bi bi-inbox"></i>
                            <h3>No bookings found</h3>
                            <p>Try adjusting your filters to see more results</p>
                        </div>
                    `;
                    return;
                }
                
                bookings.forEach((booking, index) => {
                    const statusClass = booking.status === 'completed' ? 'past' : 'upcoming';
                    const statusBadgeClass = booking.status;
                    const statusText = booking.status.charAt(0).toUpperCase() + booking.status.slice(1);
                    
                    const bookingElement = document.createElement('div');
                    bookingElement.className = `booking-item ${statusClass}`;
                    bookingElement.style.animationDelay = `${index * 0.2}s`;
                    
                    bookingElement.innerHTML = `
                        <div class="booking-date">
                            <span class="day">${booking.date.day}</span>
                            <span class="month">${getMonthName(booking.date.month)}</span>
                            <span class="year">${booking.date.year}</span>
                        </div>
                        <div class="booking-details">
                            <h4>${booking.destination}</h4>
                            <div class="info-row">
                                <i class="bi bi-geo-alt-fill"></i>
                                <span>${booking.airport}</span>
                            </div>
                            <div class="info-row">
                                <i class="bi bi-people-fill"></i>
                                <span>${booking.guests} Guests</span>
                            </div>
                            <div class="info-row">
                                <i class="bi bi-calendar-check-fill"></i>
                                <span>${booking.days} Days / ${booking.nights} Nights</span>
                            </div>
                            <div class="booking-status">
                                <span class="status-badge ${statusBadgeClass}">${statusText}</span>
                                <span class="price">$${booking.price.toLocaleString()}</span>
                            </div>
                        </div>
                    `;
                    
                    bookingsList.appendChild(bookingElement);
                });
            }
            
            function getMonthName(monthNumber) {
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                return months[monthNumber - 1];
            }
            
            // Add event listeners
            monthFilter.addEventListener('change', filterBookings);
            yearFilter.addEventListener('change', filterBookings);
            statusFilter.addEventListener('change', filterBookings);
            
            // Initial display
            filterBookings();
        });

        // Load more bookings function
        function loadMoreBookings(event) {
            const button = event && event.target ? event.target : document.querySelector('.view-more-btn');
            if (!button) return;
            
            button.innerHTML = '<span class="loading-spinner"></span> Loading...';
            button.disabled = true;
            
            // Simulate loading more bookings
            setTimeout(() => {
                // Add more sample bookings
                const additionalBookings = [
                    {
                        id: 6,
                        destination: 'Sydney, Australia',
                        airport: 'Sydney Kingsford Smith',
                        guests: 4,
                        days: 8,
                        nights: 7,
                        date: { day: 18, month: 6, year: 2026 },
                        status: 'confirmed',
                        price: 3800
                    },
                    {
                        id: 7,
                        destination: 'Rome, Italy',
                        airport: 'Fiumicino',
                        guests: 2,
                        days: 5,
                        nights: 4,
                        date: { day: 12, month: 7, year: 2026 },
                        status: 'confirmed',
                        price: 2200
                    },
                    {
                        id: 8,
                        destination: 'New York, USA',
                        airport: 'JFK',
                        guests: 3,
                        days: 6,
                        nights: 5,
                        date: { day: 25, month: 8, year: 2026 },
                        status: 'confirmed',
                        price: 3500
                    }
                ];
                
                // Add to existing bookings
                allBookings.push(...additionalBookings);
                
                // Re-apply current filters
                filterBookings();
                
                button.innerHTML = 'View More Bookings';
                button.disabled = false;
                
                // Show success message
                const successMsg = document.createElement('div');
                successMsg.className = 'success-message';
                successMsg.textContent = '3 more bookings loaded!';
                successMsg.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: linear-gradient(135deg, #28a745, #20c997);
                    color: white;
                    padding: 12px 20px;
                    border-radius: 8px;
                    box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
                    z-index: 1000;
                    animation: slideInRight 0.3s ease-out;
                `;
                document.body.appendChild(successMsg);
                
                setTimeout(() => {
                    if (successMsg.parentNode) {
                        successMsg.remove();
                    }
                }, 3000);
            }, 1000);
        }

        // Add ripple effect to buttons
        function createRipple(event) {
            const button = event.currentTarget;
            const ripple = document.createElement('span');
            const rect = button.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = event.clientX - rect.left - size / 2;
            const y = event.clientY - rect.top - size / 2;
            
            ripple.style.cssText = `
                position: absolute;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.5);
                transform: scale(0);
                animation: ripple 0.6s linear;
                left: ${x}px;
                top: ${y}px;
                width: ${size}px;
                height: ${size}px;
            `;
            
            button.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 600);
        }

        // Add ripple styles
        const rippleStyle = document.createElement('style');
        rippleStyle.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
            
            @keyframes slideInRight {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            
            button {
                position: relative;
                overflow: hidden;
            }
        `;
        document.head.appendChild(rippleStyle);

        // Apply ripple effect to all buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', createRipple);
        });
    </script>
</body>
</html>
