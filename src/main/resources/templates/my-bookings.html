<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | Trip.Next</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f7fb; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 10px 24px rgba(0,0,0,0.08); margin-bottom: 16px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .muted { color: #666; font-size: 14px; }
        .empty { text-align: center; color: #666; padding: 30px 0; }
        .btn { border: none; background: #2563eb; color: #fff; padding: 10px 14px; border-radius: 8px; cursor: pointer; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .actions { display: flex; gap: 10px; margin-top: 16px; }
        .top-link { text-decoration: none; color: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h2 style="margin:0;">My Bookings</h2>
                <p class="muted" th:text="'Logged in as: ' + ${userEmail}">Logged in as</p>
            </div>
            <div class="actions">
                <a href="index.html" class="top-link">Back Home</a>
                <form action="/api/logout" method="post">
                    <button class="btn" type="submit">Logout</button>
                </form>
            </div>
        </div>

        <div id="bookingList">
            <div class="card booking-item" th:each="booking : ${bookings}">
                <h3 style="margin-top:0;" th:text="'Booking #' + ${booking.bookingId}">Booking</h3>
                <p><strong>Destination:</strong> <span th:text="${booking.destination}">Destination</span></p>
                <p><strong>Travel Date:</strong> <span th:text="${booking.travelDate}">Date</span></p>
                <p><strong>Guests:</strong> <span th:text="${booking.guests}">1</span></p>
                <p><strong>Total Price:</strong> $<span th:text="${booking.totalPrice}">0.00</span></p>
                <p><strong>Status:</strong> <span th:text="${booking.bookingStatus}">CONFIRMED</span></p>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(bookings)}" class="card empty">
            No bookings yet. Create one from the booking page.
        </div>

        <div th:unless="${#lists.isEmpty(bookings)}" style="text-align:center; margin-top: 12px;">
            <button id="viewMoreBtn" class="btn" type="button">View More Bookings</button>
        </div>
    </div>

    <script>
        (function () {
            const items = Array.from(document.querySelectorAll('.booking-item'));
            const viewMoreBtn = document.getElementById('viewMoreBtn');
            const pageSize = 3;
            let visibleCount = pageSize;

            if (!viewMoreBtn) return;

            function render() {
                items.forEach((item, idx) => {
                    item.style.display = idx < visibleCount ? 'block' : 'none';
                });
                if (visibleCount >= items.length) {
                    viewMoreBtn.disabled = true;
                    viewMoreBtn.textContent = 'No More Bookings';
                }
            }

            viewMoreBtn.addEventListener('click', function () {
                visibleCount += pageSize;
                render();
            });

            render();
        })();
    </script>
</body>
</html>
