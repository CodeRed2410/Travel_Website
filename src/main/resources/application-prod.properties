# Online PostgreSQL profile (Neon/Supabase/Railway/Render)
# Supports both custom vars and common platform vars.
spring.datasource.url=${DB_URL:${JDBC_DATABASE_URL}}
spring.datasource.username=${DB_USERNAME:${JDBC_DATABASE_USERNAME}}
spring.datasource.password=${DB_PASSWORD:${JDBC_DATABASE_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
