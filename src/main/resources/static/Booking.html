<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip.Next | Confirm Booking</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/media.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* Enhanced booking page styles */
        .booking-main {
            min-height: auto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 24px 16px;
        }

        .booking-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            padding: 24px;
            max-width: 640px;
            width: 100%;
            box-shadow: 0 10px 24px rgba(0,0,0,0.08);
            margin: 20px 0;
        }

        .booking-card h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2em;
        }

        .booking-card p {
            color: #666;
            text-align: center;
            margin-bottom: 16px;
            font-size: 0.98rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #e9ecef;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .row {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
        }

        .row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .confirm-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .confirm-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .confirm-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Message styles */
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .booking-card {
                padding: 18px;
                margin: 12px;
            }

            .row {
                flex-direction: column;
                gap: 8px;
            }

            .row .form-group {
                margin-bottom: 12px;
            }
        }

        /* Header navigation styles */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 10px 0;
        }

        header nav {
            width: 95%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header nav h4 {
            color: #333;
            margin: 0;
        }

        header nav ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        header nav ul li {
            padding: 5px 15px;
        }

        header nav ul li a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        header nav ul li a:hover {
            color: #667eea;
        }

        .li_btn {
            background: #333;
            border-radius: 20px;
            padding: 5px 15px !important;
        }

        .li_btn a {
            color: white !important;
        }

        .bi-three-dots {
            display: none;
        }

        @media (max-width: 768px) {
            header nav ul {
                display: none;
            }

            .bi-three-dots {
                display: block;
                font-size: 24px;
                cursor: pointer;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
           <h4><a href="index.html" style="text-decoration: none; color: inherit;">Trip.Next</a></h4>
            <ul id="menu_bx">
                <li><a href="index.html">Home</a></li>
                <li><a href="#">Discover</a></li>
                <li><a href="#">Special Deals</a></li>
                <li><a href="#">About US</a></li>
                <li class="li_btn"><a href="login.html">Login</a></li>
                <li class="li_btn"><a href="register.html">Register</a></li>
            </ul>
            <i class="bi bi-three-dots"></i>
        </nav>
    </header>

    <main class="booking-main" style="margin-top: 12px;">
        <div class="booking-card">
            <h1>Plan Your Trip</h1>
            <p>Finalize your details for the perfect getaway.</p>
            
            <!-- Message Display Area -->
            <div id="messageArea"></div>
            
            <form action="/api/bookings/confirm" method="POST" id="bookingForm">
                <div class="form-group">
                    <label>Destination</label>
                    <input type="text" name="destination" id="destination" placeholder="Where to?" required>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Travel Date</label>
                        <input type="date" name="travelDate" id="travelDate" required>
                    </div>
                    <div class="form-group">
                        <label>Guests</label>
                        <input type="number" name="guests" id="guests" min="1" max="10" value="1" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Special Requests</label>
                    <textarea name="notes" id="notes" placeholder="Extra pillows, window seat, etc."></textarea>
                </div>

                <button type="submit" class="confirm-btn">Confirm Booking</button>
            </form>
        </div>
    </main>

<script>
// Check for URL parameters and display messages
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('success') === 'true') {
    showMessage('Booking confirmed successfully! Check your email for details.', 'success');
}

// Populate form with search parameters from main page
function populateFormFromParams() {
    const destination = urlParams.get('destination');
    const checkin = urlParams.get('checkin');
    const people = urlParams.get('people');
    
    if (destination) {
        document.getElementById('destination').value = decodeURIComponent(destination);
    }
    if (checkin) {
        document.getElementById('travelDate').value = checkin;
    }
    if (people) {
        document.getElementById('guests').value = people;
    }
}

// Enhanced initialization
document.addEventListener('DOMContentLoaded', function() {
    // Initialize form with parameters
    populateFormFromParams();
    
    // Set minimum date to today
    const travelDateInput = document.getElementById('travelDate');
    travelDateInput.min = new Date().toISOString().split('T')[0];
    
    // Add input event listeners for real-time validation
    document.getElementById('destination').addEventListener('input', function() {
        if (this.value.trim()) {
            this.style.borderColor = '#28a745';
        } else {
            this.style.borderColor = '#e9ecef';
        }
    });
    
    document.getElementById('travelDate').addEventListener('change', function() {
        const selectedDate = new Date(this.value);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        
        if (selectedDate >= today) {
            this.style.borderColor = '#28a745';
        } else {
            this.style.borderColor = '#dc3545';
        }
    });
    
    document.getElementById('guests').addEventListener('input', function() {
        const value = parseInt(this.value);
        if (value >= 1 && value <= 10) {
            this.style.borderColor = '#28a745';
        } else {
            this.style.borderColor = '#dc3545';
        }
    });
});

// Enhanced form validation with better error handling
document.getElementById('bookingForm').addEventListener('submit', function(e) {
    const destination = document.getElementById('destination').value.trim();
    const travelDate = document.getElementById('travelDate').value;
    const guests = document.getElementById('guests').value;
    
    // Clear previous messages
    document.getElementById('messageArea').innerHTML = '';
    
    // Client-side validation
    if (!destination) {
        e.preventDefault();
        showMessage('Please enter a destination', 'error');
        document.getElementById('destination').focus();
        return;
    }
    
    if (!travelDate) {
        e.preventDefault();
        showMessage('Please select a travel date', 'error');
        document.getElementById('travelDate').focus();
        return;
    }
    
    const selectedDate = new Date(travelDate);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    
    if (selectedDate < today) {
        e.preventDefault();
        showMessage('Travel date cannot be in the past', 'error');
        document.getElementById('travelDate').focus();
        return;
    }
    
    if (!guests || guests < 1 || guests > 10) {
        e.preventDefault();
        showMessage('Number of guests must be between 1 and 10', 'error');
        document.getElementById('guests').focus();
        return;
    }
    
    // Show loading state
    const submitBtn = document.querySelector('.confirm-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Processing...';
    submitBtn.style.background = '#6c757d';
    
    // Re-enable button after 10 seconds (fallback)
    setTimeout(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Confirm Booking';
        submitBtn.style.background = '';
    }, 10000);
});

function showMessage(message, type) {
    const messageArea = document.getElementById('messageArea');
    messageArea.innerHTML = `
        <div class="message ${type}">
            <i class="bi ${type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'}"></i>
            ${message}
        </div>
    `;
    
    // Auto-hide after 5 seconds for success, 8 seconds for error
    const hideTime = type === 'success' ? 5000 : 8000;
    setTimeout(() => {
        messageArea.innerHTML = '';
    }, hideTime);
    
    // Scroll to message
    messageArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
</script>

</body>
</html>
